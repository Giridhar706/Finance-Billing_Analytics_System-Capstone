name: Finance Billing Analytics CI

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

jobs:
  build:

    runs-on: ubuntu-latest

    steps:

    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Setup .NET 8
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 8.0.x

    - name: Restore Dependencies
      run: dotnet restore

    - name: Build Solution
      run: dotnet build --configuration Release --no-restore

    - name: Run Unit Tests
      run: dotnet test --configuration Release --no-build --verbosity normal

    - name: Publish MVC Application
      run: dotnet publish FinanceBillingAnalytics/FinanceBillingAnalytics.csproj -c Release -o publish

    - name: Upload Build Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: FinanceBillingAnalytics
        path: publish